<script>
const $=i=>document.getElementById(i),R=n=>Math.floor(Math.random()*n),pk=a=>a[R(a.length)],ch=p=>Math.random()<p;

const ERA=[
[1929,"Black Tuesday Plague",[9,29],["#8a6b3f","#d9b877"],"The market crashed and the dead rose with it.",["Ford Model A","Mack AC Truck","Packard Touring Bus"],["parts",2,"+2 parts: simple engines"],"A Hooverville soup line glows around oil-drum fires."],

[1969,"Summer of Chaos",[7,15],["#c4562b","#f2b84b"],"The festival never ended; the crowd just won’t stop shuffling.",["Dodge Charger","Ford F-100","VW Microbus"],["ammo",6,"+6 ammo: army surplus"],"A peaceful commune hums by the road, well fed."],
[1984,"Neon Cold War",[10,2],["#5b2a86","#e85d9c"],"Synths, shoulder pads and a virus slipped from a Soviet lab.",["DeLorean","Army Jeep","Dodge Ram Van"],["med",2,"+2 medicine: pharmacy raid"],"A ghost-mall arcade still blinks its neon."],
[1999,"Y2K Outbreak",[11,31],["#0f5b66","#78d6c6"],"The clocks rolled over and so did the dead. Pagers buzz in the dark.",["Pontiac Firebird","Hummer H1","Ice Cream Truck"],["money",150,"+$150: ATM glitch"],"A strip-mall payphone rings: a Y2K survivor hotline."]];

const PF=[["Soldier","ammo",8,"+8 ammo, fights better"],["Mechanic","parts",3,"+3 parts, cheaper repairs"],["Nurse","med",3,"+3 medicine, stronger cures"],["Scavenger","money",150,"+$150, finds more loot"]];

const IT=[["fuel","gal fuel",10,15],["food","lb food",20,10],["ammo","ammo boxes",2,8],["med","medicine",1,12],["parts","parts",1,15]];
const FX={time:["⏳ 🕰️ 📅","fall","w","gl"],car:["💨 🔥 ⚙️","burst","",0],paint:["🎨 💧 🖌️","burst","g",0],map:["🗺️ 📍 🧭","rise","",0],badge:["⭐ 🎖️ ✨","burst","w",0],gun:["💥 🔫","burst","w","sk"],melee:["💢 🩸 💥","burst","r","sk"],pet:["❤️ 🐾","rise","",0],buy:["💰 🪙 💵","rise","",0],fuel:["⛽ 💧","rise","",0],heal:["💊 💚 ✨","rise","g",0],zom:["🧟 💀 🦴","fall","r","sk"],boom:["💥 🔥","burst","r","sk"],fire:["🔥 🔥 💨","rise","r",0],skull:["💀 ☠️","rise","r","sk"],radio:["📻 📡 🎵","burst","g","gl"],tire:["🛞 🔧 ⚙️","burst","",0],run:["💨 💨","rise","",0],heli:["🚁 💨","fall","w",0],name:["✍️ 📓","rise","",0]};

const A=()=>P.filter(p=>!p.x),pa=()=>pk(A()),lose=(k,n)=>{G[k]=Math.max(0,G[k]-n)},up=n=>A().forEach(p=>p.h=Math.min(100,p.h+n)),adv=n=>{for(let i=0;i<n;i++)day(1)};
const stop=()=>{clearInterval(TI);if(G)G.run=0},cn=()=>Math.ceil([2,1.5,1][G.rat]*A().length);
const LM=()=>RT[G.rt][4].map((n,i,a)=>[n,Math.round(END*(i+1)/(a.length+1))]);
const dmg=n=>{G.hp=Math.max(0,G.hp-Math.round(n/VT[G.vt][2]))};
function newG(){G={on:0,mi:0,d:new Date(1955,5,14),fuel:0,food:0,ammo:0,med:0,parts:0,money:420,pace:0,rat:0,w:"clear",T:60,nl:0,hp:100,era:2,vt:-1,col:"#777",rt:0,pf:0,wp:0,pet:2,run:0,msgs:[],tn:0};P=[];CX=-80;ZS=[]}
/* ===== EFFECTS ===== */
function fx(k){const f=FX[k];if(!f)return;const e=f[0].split(" "),F=$("fx"),m=f[1];
 for(let i=0;i<14;i++){const s=document.createElement("span"),a=Math.random()*6.28,r=80+R(140),b=m=="burst";s.className="pt";s.textContent=pk(e);
  s.style.cssText=`left:${b?50:R(95)}%;top:${b?50:m=="rise"?85:0}%;--x:${b?Math.cos(a)*r:R(60)-30}px;--y:${b?Math.sin(a)*r:m=="rise"?-120-R(60):150+R(60)}px;--r:${R(360)}deg;animation-delay:${R(300)}ms`;
  F.appendChild(s);setTimeout(()=>s.remove(),1700)}
 if(f[2]){const l=$("fl");l.style.setProperty("--fc",{r:"#c00",g:"#2d2",w:"#fff"}[f[2]]);l.style.animation="none";void l.offsetWidth;l.style.animation="fl .5s"}
 if(f[3]){const s=$("st");s.className="";void s.offsetWidth;s.className=f[3]}}
/* ===== UI CORE ===== */
function tw(el,t){el.textContent="";let i=0;const k=setInterval(()=>{el.textContent=t.slice(0,++i);if(i>=t.length)clearInterval(k)},16)}
function ask(t,o,nx=go){stop();const u=$("ui");u.innerHTML="<p id=m></p>";tw($("m"),t);
 o.forEach(([l,f,x,c])=>{const b=document.createElement("button");b.textContent=l;if(c)b.style.borderLeft="12px solid "+c;
  b.onclick=()=>{[...u.children].forEach(e=>e.disabled=1);if(x){fx(x);setTimeout(()=>run(f,nx),650)}else run(f,nx)};u.appendChild(b)})}
function run(f,nx){const r=f();if(typeof r=="string")done(r,nx)}
function done(t,nx=go){stop();t=(t+" "+G.msgs.splice(0).join(" ")).trim();const u=$("ui");u.innerHTML="<p id=m></p><button id=cc>Continue</button>";tw($("m"),t);hud();$("cc").onclick=nx}
document.addEventListener("keydown",e=>{if(e.target.tagName=="INPUT")return;const b=$("ui").querySelectorAll(":scope>button")[e.key-1];if(b&&!b.disabled)b.click()});
function hud(){if(!G.on)return;const g=G,l=LM()[g.nl];
 $("hud").innerHTML=`<div><b>${g.d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}</b> · ${g.w}, ${g.T}°F</div><div>To sanctuary: <b>${Math.max(0,END-Math.floor(g.mi))}</b> mi · Next: ${l?l[0]+" ("+(l[1]-Math.floor(g.mi))+" mi)":"the sanctuary gates"}</div><div>⛽<b>${Math.ceil(g.fuel)}</b> 🍖<b>${g.food}</b> 🔫<b>${g.ammo}</b> 💊<b>${g.med}</b> 🔧<b>${g.parts}</b> 💵<b>${g.money}</b></div><div>Car <i class=bar><u style="width:${g.hp}%"></u></i> · ${PN[g.pace]} pace · ${RN[g.rat]} rations ${PET[g.pet][1]}</div>`;
 $("pty").innerHTML=P.map(p=>`<div class="pp${p.x?" dead":""}">${p.n}${p.inf>0?" 🩸"+p.inf+"d":""}<i><u style="width:${p.h}%;background:${p.h>60?"var(--gd)":p.h>30?"#e8a317":"var(--bad)"}"></u></i></div>`).join("");
 $("pg").firstChild.style.width=Math.min(100,g.mi/END*100)+"%"}
/* ===== SETUP: LOTS OF CHOICES ===== */
function intro(){stop();newG();hz=2;$("hud").innerHTML="";$("pty").innerHTML="";$("pg").firstChild.style.width=0;
 ask("The dead have risen somewhere in the 20th century. YOU pick the year, the ride, the crew and the road. Reach the last sanctuary before the horde catches you.",[["Begin the outbreak",sEra,"zom"]])}
const sEra=()=>ask("Pick the year the dead rise:",ERA.map((e,i)=>[`${e[0]}: ${e[1]}`,()=>{G.era=i;G.d=new Date(e[0],e[2][0],e[2][1]);sVeh()},"time"]));
const sVeh=()=>ask(ERA[G.era][4]+" Choose your ride:",VT.map((v,i)=>[`${ERA[G.era][5][i]} (${v[5]})`,()=>{G.vt=i;CX=-80;sCol()},"car"]));
const sCol=()=>ask("Pick a paint job:",COL.map(([n,c])=>[n,()=>{G.col=c;sRt()},"paint",c]));
const sRt=()=>ask("Choose your road to sanctuary:",RT.map((r,i)=>[`${r[0]}: ${r[1]} (${r[2]} mi)`,()=>{G.rt=i;END=r[2];sPf()},"map"]));
const sPf=()=>ask("Who were you before the end?",PF.map((p,i)=>[`${p[0]}: ${p[3]}`,()=>{G.pf=i;sWp()},"badge"]));
const sWp=()=>ask("Pick your weapon:",WP.map((w,i)=>[`${w[0]}${w[2]?" (uses ammo)":" (silent, no ammo)"}`,()=>{G.wp=i;sPet()},w[3]]));
const sPet=()=>ask("Pick a companion:",PET.map((p,i)=>[`${p[1]} ${p[0]}: ${p[2]}`,()=>{G.pet=i;sName()},i<2?"pet":"run"]));
function sName(){stop();$("ui").innerHTML='<p>Name the driver. Three survivors ride along.</p><input id=nm maxlength=12 value="Alex"> <button id=ok>Gather the crew</button>';$("ok").onclick=()=>{fx("name");setTimeout(crew,650)}}
function crew(){const nm=$("nm").value.trim()||"Alex",pool=NMS.filter(n=>n!=nm).sort(()=>Math.random()-.5),e=ERA[G.era],f=PF[G.pf];
 P=[nm,...pool.slice(0,3)].map(n=>({n,h:100,inf:0,x:0}));G[e[6][0]]+=e[6][1];G[f[1]]+=f[2];G.on=1;hz=0;hud();
 shop(()=>{fx("car");go()},1,`Perks: ${e[6][2]}; ${f[3]}.`)}
function shop(back,m,msg){const u=$("ui");stop();u.innerHTML=`<p>${msg} 💵 $${G.money}. Pack for the road.</p>`;
 IT.forEach(([k,l,s,p])=>{const c=Math.ceil(p*m),r=document.createElement("div");r.className="row";r.innerHTML=`<span>${G[k]} ${l} ($${c} per ${s})</span>`;
  const b=document.createElement("button");b.textContent="+"+s;b.onclick=()=>{if(G.money<c)return fx("skull");G.money-=c;G[k]+=s;fx("buy");shop(back,m,msg);hud()};r.appendChild(b);u.appendChild(r)});
 const d=document.createElement("button");d.textContent="Done shopping";d.onclick=back;u.appendChild(d)}
/* ===== DRIVING LOOP ===== */
function wx(){const T=[30,34,45,58,68,78,86,84,72,58,42,32][G.d.getMonth()]+R(16)-8,r=Math.random();G.T=T;G.w=T<30?"snow":r<.12?"rain":r<.18?"thunderstorm":r<.26?"fog":T>92?"scorching":pk(["clear","clear","clear","overcast","windy"])}
function hurt(p,n,c){if(p.x)return;p.h-=n;if(p.h<=0){p.h=0;p.x=1;p.inf=0;G.msgs.push(`${p.n} has died${c?" of "+c:""}.`)}}
function day(rest){const a=A(),n=a.length,V=VT[G.vt];G.d.setDate(G.d.getDate()+1);wx();
 if(!rest){const m=Math.round([90,125,165][G.pace]*V[1]*(WS[G.w]||1)*(.5+G.hp/200))+R(15);G.mi+=m;G.fuel=Math.max(0,G.fuel-m/V[3]);G.hp-=[0,R(2),R(5)][G.pace]}
 G.food-=Math.ceil([2,1.5,1][G.rat]*n);let st=0;if(G.food<0){G.food=0;st=1}
 a.forEach(p=>{const d=[1,0,-2][G.rat]+(rest?3:0)+(G.pet==1)+(G.pf==2&&rest)-(G.T<32)-(G.T>95)-(st?5:0);if(d<0)hurt(p,-d,st?"starvation":"exposure");else p.h=Math.min(100,p.h+d);if(p.inf>0&&--p.inf==0&&!p.x)G.tn=p})}
function chk(){if(P[0].x){over(P[0].n+" is gone. Without a driver, the convoy falls apart.");return 1}if(!A().length){over("No one is left alive.");return 1}}
function go(){if(chk())return;hz=0;G.run=1;$("ui").innerHTML='<p id=tk>The engine growls to life…</p><button id=pu>Pull over (menu)</button>';$("pu").onclick=()=>{stop();menu()};clearInterval(TI);TI=setInterval(tick,750)}
function tick(){day();hud();if(chk())return;const l=LM()[G.nl];
 if(G.msgs.length){fx("skull");return done("")}
 if(G.mi>=END)return win();
 if(G.tn){const p=G.tn;G.tn=0;if(!p.x)return turn(p)}
 if(G.hp<=0)return wreck();if(G.fuel<=0)return dry();

 if(ch(.28*RT[G.rt][3]))return ev();
 $("tk").textContent=G.fuel<20?"⚠️ The fuel needle sits near E.":G.food<cn()*3?"⚠️ The food is almost gone.":pk(["Dead cornfields roll by.","A crow picks at a wrecked sedan.","The radio hisses static.","Smoke rises on the horizon.",`${pa().n} ${pk(["counts the dead on the shoulder","sharpens a blade","keeps watch at the window","spots a burning farmhouse"])}.`])}
function menu(){ask("🅿️ You pull over. The engine ticks. Something moans far away.",[["Drive on",go,"car"],["Scavenge nearby (1 day)",scav,"zom"],["Rest (1 day)",()=>{adv(1);up(8);return "Everyone sleeps in shifts. +health."},"heal"],["Pace: "+PN[G.pace]+" ▸",()=>{G.pace=(G.pace+1)%3;menu()}],["Rations: "+RN[G.rat]+" ▸",()=>{G.rat=(G.rat+1)%3;menu()}],["Use medicine",med,"heal"],["Repair car (1 part)",rep,"tire"]],menu)}
function med(){if(!G.med)return "No medicine left.";const b=A().find(p=>p.inf>0),p=b||A().sort((x,y)=>x.h-y.h)[0];G.med--;if(b){if(ch(G.pf==2?.9:.7)){b.inf=0;return `The serum works! ${b.n} is no longer infected.`}return `The serum fails. ${b.n} is still doomed.`}p.h=Math.min(100,p.h+(G.pf==2?40:25));return `${p.n} feels much better.`}
function rep(){if(!G.parts)return "No spare parts.";if(!(G.pf==1&&ch(.5)))G.parts--;G.hp=Math.min(100,G.hp+35+(G.pf==1?15:0));return "Wrenches ring. The car runs better."}
function fight(m){const w=WP[G.wp];let p=w[1]+(G.pf==0?.1:0)-m;if(w[2]){if(G.ammo>0)G.ammo--;else p-=.3}return ch(p)}
const bite=()=>{const p=pa();p.inf=3;hurt(p,15);fx("skull");return `${p.n} is bitten! Three days to cure them.`};
function scav(){adv(1);const r=Math.random();if(r<.3+(G.pf==3?.15:0)){const k=pk(["food","ammo","med","parts","fuel"]),q=k=="food"?40+R(80):k=="fuel"?10+R(20):1+R(3);G[k]+=q;fx("buy");return `You find ${q} ${NMM[k]}.`}if(r<.6)return "Empty shelves, dust and graffiti.";return fight(.1)?"Zombies burst from a freezer. You cut your way out.":bite()}
/* ===== CRISES ===== */
function turn(p){fx("zom");if(p==P[0])return over(p.n+" turns at the wheel. The last thing you hear is your own name.");
 ask(`💀 ${p.n} turns! Eyes glaze, jaw snaps.`,[...(G.med?[["Inject the serum (1 med)",()=>{G.med--;if(ch(G.pf==2?.85:.65)){p.inf=0;return p.n+" shudders and wakes up human!"}p.x=1;return "Too late. You put them down."},"heal"]]:[]),["Put them down",()=>{if(G.ammo&&WP[G.wp][2])G.ammo--;p.x=1;return p.n+" is at peace."},"gun"],["Shove them out and drive",()=>{p.x=1;return p.n+" shrinks in the mirror…"},"run"]])}
